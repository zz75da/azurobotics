version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # These share a numpy ABI and are pinned together; upgrade them in one tested pull request.
    ignore:
      - dependency-name: numpy
      - dependency-name: pandas
      - dependency-name: opencv-python-headless
      - dependency-name: scikit-learn
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /grafana
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /mlflow-server
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
