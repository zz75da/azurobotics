[tool.ruff]
target-version = "py310"
line-length = 130
extend-exclude = [".worktrees", ".face-blur-mlflow-verified"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# E501: long lines are accepted where wrapping hurts. E701/E702: compact one-liners in tests and
# tools. B905: zip(strict=) would change behaviour, so it is not applied automatically.
ignore = ["E501", "E701", "E702", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
